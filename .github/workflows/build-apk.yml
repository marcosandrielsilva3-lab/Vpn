name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android APKs
        run: gradle :app:assembleDebug :gameturbo:assembleDebug :touchcontroller:assembleDebug
      - name: Upload VPN APK
        uses: actions/upload-artifact@v4
        with:
          name: VPNLocalDemo-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload Game Turbo APK
        uses: actions/upload-artifact@v4
        with:
          name: GameTurbo-APK
          path: gameturbo/build/outputs/apk/debug/gameturbo-debug.apk
          if-no-files-found: error
      - name: Upload Directional Controller APK
        id: directional-controller-upload
        uses: actions/upload-artifact@v4
        with:
          name: DirectionalController-APK
          path: touchcontroller/build/outputs/apk/debug/touchcontroller-debug.apk
          if-no-files-found: error
      - name: Save latest controller build coordinates
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const path = ".github/directional-controller-build.json";
            const branch = context.ref.replace("refs/heads/", "");
            let existing = null;
            try {
              existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: branch
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const artifactId = Number("${{ steps.directional-controller-upload.outputs.artifact-id }}");
            const metadata = {
              run_id: context.runId,
              artifact_id: Number.isFinite(artifactId) && artifactId > 0 ? artifactId : null,
              commit: context.sha,
              branch,
              run_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            };
            const request = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: "Record latest directional controller build",
              content: Buffer.from(JSON.stringify(metadata, null, 2)).toString("base64"),
              branch
            };
            if (existing?.data?.sha) request.sha = existing.data.sha;
            await github.rest.repos.createOrUpdateFileContents(request);
