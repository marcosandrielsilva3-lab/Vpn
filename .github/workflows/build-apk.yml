name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build both Android APKs
        run: gradle :app:assembleDebug :gameturbo:assembleDebug :touchcontroller:assembleDebug
      - name: Upload VPN APK
        uses: actions/upload-artifact@v4
        with:
          name: VPNLocalDemo-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload Game Turbo APK
        uses: actions/upload-artifact@v4
        with:
          name: GameTurbo-APK
          path: gameturbo/build/outputs/apk/debug/gameturbo-debug.apk
          if-no-files-found: error
      - name: Build Directional Controller APK
        uses: actions/upload-artifact@v4
        with:
          name: DirectionalController-APK
          path: touchcontroller/build/outputs/apk/debug/touchcontroller-debug.apk
          if-no-files-found: error
