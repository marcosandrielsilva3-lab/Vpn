plugins {
    id 'com.android.application'
}

android {
    namespace 'app.gameturbo'
    compileSdk 35

    defaultConfig {
        applicationId 'app.gameturbo'
        minSdk 23
        targetSdk 32
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
